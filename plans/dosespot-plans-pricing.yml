description: DoseSpot pricing is sales-led and not publicly listed. Packaging is organized around integration
  models - JumpStart (a pre-built iFrame/SSO prescribing UI with access to 70+ API calls) and Full Integration
  (a fully API-driven build with access to 250+ API calls) - typically combined with per-provider and/or
  per-transaction commercial terms plus EPCS (controlled substance) enablement. Exact prices, minimums,
  and metering are negotiated per customer; no published rate card exists, so plan entries below are not
  reconciled.
notes: 'Prices are not published. Contact DoseSpot sales for a quote and to confirm the metering model
  (per provider, per prescription, and/or platform fee) and EPCS pricing. Values here are structural placeholders
  pending reconciliation.


