description: DoseSpot's API v2 enforces rate limits on its endpoints to safeguard against bursts of incoming
  traffic and maximize platform stability. When a limit is reached the API returns an HTTP 429 status
  code. DoseSpot also recommends using Push Notifications instead of polling to reduce request volume.
  Specific numeric limits are not published and are not reconciled in this artifact.
notes: 'Re-verified 2026-08-15 on DoseSpot''s own developer portal and the v1-to-v2 migration notice.
  DoseSpot states "All endpoints will enforce reasonable rate limits" and returns HTTP 429 when a limit
  is exceeded, but publishes NO numeric limit, window, burst or response header anywhere public - "Rate
  limit specifics are shared by the Integration Specialist". limit_count is therefore an honest 0: the
  policy is documented, the numbers are not.'
