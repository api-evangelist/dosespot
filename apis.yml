aid: dosespot
url: https://raw.githubusercontent.com/api-evangelist/dosespot/refs/heads/main/apis.yml
name: DoseSpot
kind: company
description: DoseSpot is a Surescripts- and EPCS-certified electronic prescribing
  (eRx) platform. Its REST API (v2) lets healthcare and EHR/EMR software embed the
  full prescription lifecycle - patient and clinician management, medication and
  drug search, pharmacy selection, e-prescribing, medication history, eligibility,
  and push notifications - using OAuth2 Bearer tokens scoped by clinic and clinician
  keys.
