aid: dosespot
url: https://raw.githubusercontent.com/api-evangelist/dosespot/refs/heads/main/apis.yml
name: DoseSpot
kind: company
description: 'DoseSpot is a Surescripts- and EPCS-certified electronic prescribing (eRx) platform that
  EHR, EMR, telehealth and digital-health vendors embed to add the full prescription lifecycle to their
  own software. The REST API v2 covers patients and demographics, allergies and allergen search, Medi-Span
  medication and supply search, drug-drug and drug-allergy interaction screening, the Surescripts pharmacy
  directory, prescription creation, signing and transmission including DEA-regulated EPCS for controlled
  substances, refill and RxChange queues, medication history, eligibility and real-time prescription benefit,
  electronic prior authorization, PDMP/Narx reports, and clinician, clinic and DEA-number administration.
  DoseSpot publishes two Swagger 2.0 contracts from its own SwaggerHub organization - Full + EPCS (171
  operations) and JumpStart + EPCS (139 operations) - rendered at docs.dosespot.com, which DoseSpot calls
  the official source for its technical documentation. Access is sales-gated: credentials are issued by
  an assigned Integration Specialist. DoseSpot is part of Interra Health, alongside its subsidiary pVerify.'
