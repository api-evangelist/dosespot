  errors: errors/dosespot-error-codes.yml
  problem_types: errors/dosespot-problem-types.yml
  lifecycle: lifecycle/dosespot-lifecycle.yml
  authentication: authentication/dosespot-authentication.yml
  rate_limits: rate-limits/dosespot-rate-limits.yml
  vocabulary: vocabulary/dosespot-vocabulary.yml
  data_model: data-model/dosespot-data-model.yml
