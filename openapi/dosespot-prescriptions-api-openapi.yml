      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodedPrescriptionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CodedPrescriptionRequest'
          application/problem+json:
            schema:
              $ref: '#/components/schemas/CodedPrescriptionRequest'
          application/xml:
