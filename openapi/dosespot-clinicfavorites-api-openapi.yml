paths:
  /api/clinics/{clinicId}/prescriptionFavorites:
    get:
      tags:
      - ClinicFavorites
      summary: Search for clinic prescription favorites
      description: Looks for at least 2 letter name with either all favorite types, Medication, Supply, or CompiledCompound favorite type
      operationId: ClinicFavorites_GetClinicPrescriptionFavoritesV2
      parameters:
      - name: clinicId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: favoriteType
        in: query
        required: false
        schema:
          type: string
          enum:
          - All
          - Medication
          - Supply
          - CompiledCompound
          maximum: 3
          minimum: 0
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 2147483645
          minimum: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 100
          minimum: 1
      - name: searchName
        in: query
        required: false
        schema:
          type: string
          pattern: ^.{2,}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedListResponse_ClinicFavoritePrescriptionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedListResponse_ClinicFavoritePrescriptionResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PagedListResponse_ClinicFavoritePrescriptionResponse'
