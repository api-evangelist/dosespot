        PayerName:
          type: string
        DrugUseEvaluations:
          type: array
          items:
            $ref: '#/components/schemas/DrugUseEvaluation'
    RTPSCoupon:
      type: object
      properties:
        BIN:
          type: string
        PCN:
          type: string
        MemberID:
          type: string
        GroupID:
          type: string
    PrescriptionDiagnosis:
      type: object
      properties:
        PrimaryDiagnosis:
          $ref: '#/components/schemas/Diagnosis'
        SecondaryDiagnosis:
          $ref: '#/components/schemas/Diagnosis'
    ReconcileRxChangeRequest:
      type: object
      required:
      - ReferencedPrescriptionId
      properties:
        ReferencedPrescriptionId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    PagedListResponse_GetRxChangeResponse:
      type: object
      properties:
        Items:
          type: array
          description: The list of elements to return.
          readOnly: true
          items:
            $ref: '#/components/schemas/GetRxChangeResponse'
        PageResult:
          $ref: '#/components/schemas/PageResult'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
    Response:
      type: object
      properties:
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: The result of the operation.
    Prescription:
      type: object
      properties:
        FirstPrescriptionDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosis'
        SecondPrescriptionDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosis'
        Refills:
          type: string
        PrescriptionId:
          type: integer
          format: int32
        WrittenDate:
          type: string
          format: date-time
        Directions:
          type: string
        Quantity:
          type: string
        DispenseUnitId:
          type: integer
          format: int32
        DaysSupply:
          type: integer
          format: int32
        PharmacyId:
          type: integer
          format: int32
        PharmacyNotes:
          type: string
        NoSubstitutions:
          type: boolean
        EffectiveDate:
          type: string
          format: date-time
        LastFillDate:
          type: string
          format: date-time
        PrescriberId:
          type: integer
          format: int32
        PrescriberAgentId:
          type: integer
          format: int32
        RxReferenceNumber:
          type: string
        Status:
