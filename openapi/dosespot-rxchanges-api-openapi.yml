          format: int32
        RequestedMedications:
          type: array
          items:
            type: integer
            format: int32
        ClinicianId:
          type: integer
          format: int32
        ClinicId:
          type: integer
          format: int32
        PharmacyId:
          type: integer
          format: int32
        RequestedDate:
          type: string
          format: date-time
        RequestExpirationDate:
          type: string
          format: date-time
        OriginalPrescriptionId:
          type: integer
          format: int32
        PayerName:
