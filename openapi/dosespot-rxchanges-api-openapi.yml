        PriorAuthNumber:
          type: string
        SelectedMedicationId:
          type: integer
          format: int32
        NewPrescriptionPatientId:
          type: integer
          format: int32
        NewPrescription:
          $ref: '#/components/schemas/CodedPrescriptionRequest'
        Comment:
          type: string
          minLength: 0
          maxLength: 500
        PrescriberAuthorizationData:
          type: string
          minLength: 0
          maxLength: 32
        PrescriberLicenseInactive:
          type: boolean
    IdentifierResponse:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          description: The entity identifier.
        Result:
          description: The result of the operation.
