        SecondPrescriptionDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosisIds'
        Refills:
          type: integer
          format: int32
          minimum: 0
          maximum: 99
        DaysSupply:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
        DispenseUnitId:
          type: integer
          format: int32
        Quantity:
          type: number
          format: double
        Directions:
          type: string
          minLength: 0
          maxLength: 1000
        PharmacyId:
          type: integer
          format: int32
        PharmacyNotes:
          type: string
          minLength: 0
          maxLength: 210
        NoSubstitutions:
          type: boolean
        EffectiveDate:
          type: string
          format: date-time
        RxReferenceNumber:
          type: string
