        IsUrgent:
          type: boolean
        SupervisorId:
          type: integer
          format: int32
        RetailPharmacyToMailToPatient:
          type: boolean
        RTPSCoupon:
          $ref: '#/components/schemas/RTPSCoupon'
        Status:
          type: string
          enum:
          - Unknown
          - Active
          - Inactive
          - Discontinued
          - Deleted
          - Completed
          - CancelRequested
          - CancelPending
          - Cancelled
          - CancelDenied
          - Changed
          - FullFill
          - PartialFill
          - NoFill
        InactiveDate:
          type: string
          format: date-time
        Comment:
          type: string
          minLength: 0
          maxLength: 500
        Encounter:
          type: string
          minLength: 0
          maxLength: 50
    GetRxChangeDetailedResponse:
      type: object
      properties:
        RxChangeRequestId:
          type: integer
          format: int32
        RxChangeType:
          type: string
        RxChangeSubType:
          type: string
        Source:
          type: string
        NewPatient:
          type: boolean
        Patient:
          $ref: '#/components/schemas/Patient'
        UnmatchedChange:
          type: boolean
        PrescribedPrescription:
          $ref: '#/components/schemas/Prescription'
        RequestedMedications:
          type: array
          items:
            $ref: '#/components/schemas/Prescription'
        ClinicianId:
          type: integer
          format: int32
        ClinicId:
          type: integer
          format: int32
        PharmacyId:
          type: integer
          format: int32
        RequestedDate:
          type: string
          format: date-time
        RequestExpirationDate:
          type: string
          format: date-time
        OriginalPrescription:
