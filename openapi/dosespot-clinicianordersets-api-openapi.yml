components:
  schemas:
    IdentifierResponse:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          description: The entity identifier.
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: Represents a generic response containing an entity identifier.
    OrderSetFavorite:
      type: object
      required:
      - Directions
      - DispenseUnitTypeId
      - Quantity
      - Refills
      properties:
        DispensableDrugId:
          type: integer
          format: int32
        SupplyId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        FreeText:
          type: string
          minLength: 3
          maxLength: 300
        CompoundDescription:
          type: string
          minLength: 3
          maxLength: 2000
        CompoundIngredients:
          type: array
          items:
            $ref: '#/components/schemas/CompoundIngredient'
        FavoriteId:
          type: integer
          format: int32
        Refills:
          type: integer
          format: int32
          minimum: 0
          maximum: 99
        DaysSupply:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
        DispenseUnitTypeId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        Quantity:
          type: string
        NoSubstitutions:
          type: boolean
        Notes:
          type: string
        Directions:
          type: string
        FirstPrescriptionDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosisIds'
        SecondPrescriptionDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosisIds'
    Diagnosis:
      type: object
      properties:
        DiagnosisId:
          type: integer
          format: int32
        DiagnosisCode:
          type: string
        DiagnosisDescription:
          type: string
    Result:
      type: object
      required:
      - ResultCode
      properties:
        ResultCode:
          type: string
          description: The result code of the operation.
        ResultDescription:
          type: string
          description: A description of the result, if there were errors.
      description: Represents the result of a service operation.
    OrderSetRequest:
      type: object
      required:
      - Title
      properties:
        Title:
          type: string
          minLength: 3
          maxLength: 500
        Favorites:
          type: array
          items:
            $ref: '#/components/schemas/OrderSetFavorite'
    CompoundIngredient:
      type: object
      required:
      - Quantity
      properties:
        DispensableDrugId:
          type: integer
          format: int32
        FreeText:
          type: string
        DispenseUnitId:
          type: integer
          format: int32
        Quantity:
          type: string
        IsFreeTextEPCS:
          type: boolean
    ClinicianFavoritePrescriptionResponse:
      type: object
      properties:
        ClinicianFavoritePrescriptionID:
          type: integer
          format: int32
        ClinicianID:
          type: integer
          format: int32
        DispenseUnitTypeID:
          type: integer
          format: int32
        FirstDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosis'
        SecondDiagnosis:
          $ref: '#/components/schemas/PrescriptionDiagnosis'
        MedDisplayName:
          type: string
        MedFullName:
          type: string
        MedStrengthString:
          type: string
        Directions:
          type: string
        Quantity:
          type: string
        DispensableDrugId:
          type: integer
          format: int32
        Refills:
          type: integer
          format: int32
        DaysSupply:
          type: integer
          format: int32
        NoSubstitutions:
          type: boolean
        Notes:
          type: string
        Title:
          type: string
        SpecialtyType:
          type: string
          enum:
          - AllergyAndImmunology
          - Dermatology
          - Dentistry
          - BehavioralHealth
          - FamilyMedicine
          - InternalMedicine
          - ObstetricsAndGynecology
          - Orthopedics
          - Pediatrics
          - PhysicalMedicine
          - Psychiatry
          - Urology
        DateAdded:
          type: string
          format: date-time
        DateLastUsed:
          type: string
          format: date-time
        IsSupply:
          type: boolean
        CompoundId:
          type: integer
          format: int32
        IsCompound:
          type: boolean
        SourceClinicId:
          type: integer
          format: int32
        SupplyId:
          type: integer
          format: int32
        CompoundIngredients:
          type: array
          items:
            $ref: '#/components/schemas/CompoundIngredient'
    PrescriptionDiagnosisIds:
      type: object
      properties:
        PrimaryDiagnosisId:
          type: integer
          format: int32
        SecondaryDiagnosisId:
          type: integer
          format: int32
    OrderSetDetailsResponse:
      type: object
      properties:
        OrderSetId:
          type: integer
          format: int32
        Title:
          type: string
        Favorites:
          type: array
          items:
            $ref: '#/components/schemas/ClinicianFavoritePrescriptionResponse'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
    PrescriptionDiagnosis:
      type: object
      properties:
        PrimaryDiagnosis:
          $ref: '#/components/schemas/Diagnosis'
        SecondaryDiagnosis:
          $ref: '#/components/schemas/Diagnosis'
    OrderSetResponse:
      type: object
      properties:
        OrderSetId:
          type: integer
          format: int32
        Title:
          type: string
        Favorites:
          type: array
          items:
            $ref: '#/components/schemas/ClinicianFavoritePrescriptionResponse'
    Response:
      type: object
      properties:
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: The result of the operation.
    PagedListResponse_OrderSetResponse:
      type: object
      properties:
        Items:
          type: array
          description: The list of elements to return.
          readOnly: true
          items:
            $ref: '#/components/schemas/OrderSetResponse'
        PageResult:
          $ref: '#/components/schemas/PageResult'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
    PageResult:
      type: object
      properties:
        CurrentPage:
          type: integer
          format: int32
        TotalPages:
          type: integer
          format: int32
        PageSize:
          type: integer
          format: int32
        TotalCount:
          type: integer
          format: int32
        HasPrevious:
          type: boolean
          readOnly: true
        HasNext:
          type: boolean
          readOnly: true
