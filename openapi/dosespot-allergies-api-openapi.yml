components:
  schemas:
    IdentifierResponse:
      type: object
      properties:
        Id:
          type: integer
          format: int32
          description: The entity identifier.
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: Represents a generic response containing an entity identifier.
    CodedPatientAllergyRequest:
      type: object
      required:
      - AllergenId
      - ReactionType
      - StatusType
      properties:
        AllergenId:
          type: integer
          format: int32
        Reaction:
          type: string
          description: The patient reaction to the allergy.
          minLength: 0
          maxLength: 200
        ReactionType:
          type: string
          description: The allergy reaction type.
          enum:
          - Allergy
          - AdverseReaction
        StatusType:
          type: string
          description: The status of the allergy.
          enum:
          - Active
          - Inactive
          - Deleted
        OnsetDate:
          type: string
          format: date-time
          description: The onset date of the allergy.
    Result:
      type: object
      required:
      - ResultCode
      properties:
        ResultCode:
          type: string
          description: The result code of the operation.
        ResultDescription:
          type: string
          description: A description of the result, if there were errors.
      description: Represents the result of a service operation.
    Response:
      type: object
      properties:
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: The result of the operation.
    ListResponse_PatientAllergy:
      type: object
      properties:
        Items:
          type: array
          description: The list of elements to return.
          items:
            $ref: '#/components/schemas/PatientAllergy'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: Represents a generic response containing a list of objects.
    EditPatientAllergyRequest:
      type: object
      required:
      - ReactionType
      - StatusType
      properties:
        Reaction:
          type: string
          minLength: 0
          maxLength: 200
        ReactionType:
          type: string
          description: The allergy reaction type.
          enum:
          - Allergy
          - AdverseReaction
        StatusType:
          type: string
          description: The status of the allergy.
          enum:
          - Active
          - Inactive
          - Deleted
        OnsetDate:
          type: string
          format: date-time
          description: The onset date of the allergy.
    PatientAllergy:
      type: object
      properties:
        PatientAllergyId:
          type: integer
          format: int32
        DisplayName:
          type: string
        AllergenId:
          type: integer
          format: int32
        AllergenType:
          type: string
          enum:
          - AllergenClass
          - ScreenableIngredient
          - FoodAndEnvironmentalAllergens
          - RoutedDoseFormDrugs
        Reaction:
          type: string
        ReactionType:
          type: string
          enum:
          - Allergy
          - AdverseReaction
        StatusType:
          type: string
          enum:
          - Active
          - Inactive
          - Deleted
        OnsetDate:
          type: string
          format: date-time
        LastUpdatedUserId:
          type: integer
          format: int32
    FreetextPatientAllergyRequest:
      type: object
      required:
      - FreeTextDisplayName
      - ReactionType
      - StatusType
      properties:
        FreeTextDisplayName:
          type: string
          minLength: 0
          maxLength: 200
        Reaction:
          type: string
          description: The patient reaction to the allergy.
          minLength: 0
          maxLength: 200
        ReactionType:
          type: string
          description: The allergy reaction type.
          enum:
          - Allergy
          - AdverseReaction
        StatusType:
          type: string
          description: The status of the allergy.
          enum:
          - Active
          - Inactive
          - Deleted
        OnsetDate:
          type: string
          format: date-time
          description: The onset date of the allergy.
