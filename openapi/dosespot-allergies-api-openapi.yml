      operationId: Allergies_GetPatientAllergiesV2
      parameters:
      - name: patientId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_PatientAllergy'
            text/json:
              schema:
                $ref: '#/components/schemas/ListResponse_PatientAllergy'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ListResponse_PatientAllergy'
            application/xml:
              schema:
