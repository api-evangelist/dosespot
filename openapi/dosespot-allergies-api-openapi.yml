    - url: https://virtserver.swaggerhub.com/DoseSpot/dosespot-staging-rest-api-v2/Full_EPCSV2
  /api/patients/{patientId}/allergies/{patientAllergyId}:
    put:
      tags:
      - Allergies
      summary: Edit drug allergy
      description: Updates an existing drug allergy in a patient
      operationId: Allergies_EditPatientAllergyV2
      parameters:
      - name: patientId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      - name: patientAllergyId
        in: path
        description: ''
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
            text/json:
              schema:
                $ref: '#/components/schemas/Response'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response'
            application/xml:
              schema:
                $ref: '#/components/schemas/Response'
            text/xml:
              schema:
                $ref: '#/components/schemas/Response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPatientAllergyRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/EditPatientAllergyRequest'
          application/problem+json:
