          - Night
          - Primary
        PrimaryPhone:
          type: string
        PrimaryPhoneType:
          type: string
          enum:
          - Undefined
          - Beeper
          - Cell
          - Fax
          - Home
          - Work
          - Night
          - Primary
        Weight:
          type: number
          format: float
        WeightMetric:
          type: string
          enum:
          - lb
          - kg
        Height:
          type: number
          format: float
        HeightMetric:
          type: string
          enum:
          - inch
          - cm
        NonDoseSpotMedicalRecordNumber:
          type: string
        Active:
          type: boolean
        Encounter:
          type: string
        IsHospice:
          type: boolean
        HasSSN:
          type: boolean
    PatientSsnRequestModel:
      type: object
      required:
      - PatientSSN
      properties:
        PatientSSN:
          type: string
          pattern: ^(?:\d{9}|\d{3}-\d{2}-\d{4})$
    PageResult_2:
      type: object
      properties:
        CurrentPage:
          type: integer
          format: int32
        TotalPages:
          type: integer
          format: int32
        PageSize:
          type: integer
          format: int32
        TotalCount:
          type: integer
          format: int32
        HasPrevious:
          type: boolean
          readOnly: true
        HasNext:
          type: boolean
          readOnly: true
