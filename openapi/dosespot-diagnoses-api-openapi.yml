openapi: 3.2.0
info:
  version: Full_EPCSV2
  title: 'DoseSpot REST API - Plan: Full + EPCS - V2 Diagnoses API'
servers:
- url: https://virtserver.swaggerhub.com/DoseSpot/dosespot-staging-rest-api-v2/Full_EPCSV2
tags:
- name: Diagnoses
paths:
  /api/diagnoses/search:
    get:
      tags:
      - Diagnoses
      summary: Search Diagnoses
      description: Search diagnoses by International Classification of Diseases codes or by CDT procedural codes
      operationId: Diagnoses_DiagnosisSearchV2
      parameters:
      - name: searchTerm
        in: query
        description: The term we are searching
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: The page number default to 1
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedListResponse_DiagnosisSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedListResponse_DiagnosisSearchResult'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PagedListResponse_DiagnosisSearchResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/PagedListResponse_DiagnosisSearchResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/PagedListResponse_DiagnosisSearchResult'
components:
  schemas:
    DiagnosisSearchResult:
      type: object
      properties:
        DiagnosisId:
          type: integer
          format: int32
        DiagnosisCode:
          type: string
        DiagnosisName:
          type: string
    Result:
      type: object
      required:
      - ResultCode
      properties:
        ResultCode:
          type: string
          description: The result code of the operation.
        ResultDescription:
          type: string
          description: A description of the result, if there were errors.
      description: Represents the result of a service operation.
    PageResult:
      type: object
      properties:
        CurrentPage:
          type: integer
          format: int32
        TotalPages:
          type: integer
          format: int32
        PageSize:
          type: integer
          format: int32
        TotalCount:
          type: integer
          format: int32
        HasPrevious:
          type: boolean
          readOnly: true
        HasNext:
          type: boolean
          readOnly: true
    PagedListResponse_DiagnosisSearchResult:
      type: object
      properties:
        Items:
          type: array
          description: The list of elements to return.
          readOnly: true
          items:
            $ref: '#/components/schemas/DiagnosisSearchResult'
        PageResult:
          $ref: '#/components/schemas/PageResult'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
