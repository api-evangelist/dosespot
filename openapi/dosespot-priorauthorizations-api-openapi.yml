            application/xml:
              schema:
                $ref: '#/components/schemas/PriorAuthorizationStatusLogUIResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/PriorAuthorizationStatusLogUIResponse'
    servers:
    - url: https://virtserver.swaggerhub.com/DoseSpot/dosespot-staging-rest-api-v2/Full_EPCSV2
  /api/priorAuths/{priorAuthId}/questions/{questionId}:
    get:
