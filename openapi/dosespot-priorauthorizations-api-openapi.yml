components:
  schemas:
    Result:
      type: object
      required:
      - ResultCode
      properties:
        ResultCode:
          type: string
          description: The result code of the operation.
        ResultDescription:
          type: string
          description: A description of the result, if there were errors.
      description: Represents the result of a service operation.
    PriorAuthApproveOfflineRequest:
      type: object
      required:
      - AuthorizationNumber
      properties:
        AuthorizationNumber:
          type: string
    PAStatusLog:
      type: object
      properties:
        Status:
          type: string
        AdditionalInfoAttachmentId:
          type: integer
          format: int32
        AdditionalInfo:
          type: string
        CreatedDateStamp:
          type: string
          format: date-time
    PriorAuthorizationChoiceAnswer:
      type: object
      properties:
        PriorAuthorizationQuestionChoiceId:
          type: integer
          format: int32
        PriorAuthorizationQuestionChoiceText:
          type: string
    PriorAuthorizationAppealRequest:
      type: object
      required:
      - AppealReason
      properties:
        AppealReason:
          type: string
    PACancelDetails:
      type: object
      properties:
        CancelReason:
          type: string
    PriorAuthAnswerRequest:
      type: object
      properties:
        PriorAuthorizationQuestionChoices:
          type: array
          items:
            $ref: '#/components/schemas/PriorAuthorizationChoiceAnswer'
        DateTimeAnswer:
          type: string
          format: date-time
        NumericAnswer:
          type: number
          format: double
        FreeTextAnswer:
          type: string
    PAFinalStatus:
      type: object
      properties:
        PriorAuthorizationStatusType:
          type: string
          enum:
          - Unknown
          - Requested
          - NotRequired
          - Closed
          - Deferred
          - ActionRequired
          - Pending
          - Approved
          - Denied
          - AppealRequested
          - CancelRequested
          - Canceled
          - CancelDenied
          - Error
          - Deleted
          - PartiallyDenied
          - InProcess
        ClosedReasonCodeId:
          type: string
          enum:
          - Unknown
          - ElectronicPriorAuthNotSupported
          - Other
          - PriorAuthNotRequired
          - CannotFindMatchingPatient
          - PatientNotEligible
          - PriorAuthDuplicateApproved
          - PriorAuthDuplicateInProcess
          - ClosedByPayer
          - ClosedByProvider
          - ClosedByMember
          - AttachmentTypeNotSupported
          - PrescriberNotAllowedToSubmitPARequest
          - ResponseInconsistentWithQuestion
          - ReceiverNotPAProcessorForThisPatient
          - ReceiverNotPAProcessorForPatientMedicationCombo
          - DuplicateDenied
          - ProviderRespondedAfterDeadlineToReply
          - ProductNotCoveredByThisPlanPriorAuthorizationNotAvailable
          - PrescriptionWithinPrescribingLimitsPriorAuthorizationNotRequiredForPatientMedication
          - CoverageLimitsMayExistForQuantityAndOrDaysSupply
          - CoverageLimitsHaveBeenExceededExceptionNotAvailable
          - ActivePAOnFile
          - SubmittedProductCodeIsNotValid
        AuthorizationNumber:
          type: string
        AuthorizationPeriodStart:
          type: string
          format: date-time
        AuthorizationPeriodEnd:
          type: string
          format: date-time
        PharmacyType:
          type: string
          enum:
          - Unknown
          - Retail
          - MailOrder
          - SpecialtyPharmacy
          - LongTermCarePharmacy
          - Any
          - TwentyFourHourPharmacy
          - FaxPharmacy
          - EPCS
          - InHouseDispensing
          - Compounding
          - DME
          - Kiosk
          - SupportsDigitalSignature
          - FaxPharmacyExternal
        Quantity:
          type: string
        DaysSupply:
          type: string
        NumberOfCycles:
          type: string
        NumberOfRefills:
          type: string
        Note:
          type: string
        CanAppeal:
          type: boolean
    PriorAuthorizationQuestionResponseChoice:
      type: object
      properties:
        QuestionChoiceId:
