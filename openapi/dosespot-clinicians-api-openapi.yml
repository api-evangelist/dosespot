components:
  schemas:
    DEANumberRequest:
      type: object
      required:
      - DEANumber
      - State
      properties:
        DEANumber:
          type: string
          pattern: ^[A-Z][A-Z9][0-9]{7}(-[A-Z0-9]{1,7})?$
        AddressLine1:
          type: string
        AddressLine2:
          type: string
        City:
          type: string
        State:
          type: string
          description: State abbreviation like DC, CA or State name like 'District of Columbia', 'California'
        Zip:
          type: string
          description: 5-digits zip code or extended zip+4 with a dash separator (xxxxx-xxxx)
          pattern: ^\d{5}(-\d{4})?$
    Result:
      type: object
      required:
      - ResultCode
      properties:
        ResultCode:
          type: string
          description: The result code of the operation.
        ResultDescription:
          type: string
          description: A description of the result, if there were errors.
      description: Represents the result of a service operation.
    ItemResponse_PDMPResponse:
      type: object
      properties:
        Item:
          description: The response object.
          $ref: '#/components/schemas/PDMPResponse'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: Represents a generic response containing a single object.
    IdentifierGuidResponse:
      type: object
      properties:
        Id:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
          description: The entity identifier.
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: Represents a generic response containing an entity identifier.
    PrescriberAgentInfo:
      type: object
      properties:
        Prefix:
          type: string
        FirstName:
          type: string
        MiddleName:
          type: string
        LastName:
          type: string
        Suffix:
          type: string
    AgreementInfoResponse:
      type: object
      properties:
        AgreementId:
          type: integer
          format: int32
        AgreementDate:
          type: string
          format: date-time
        AgreementText:
          type: string
    ClinicianResyncTokenRequest:
      type: object
      required:
      - Code1
      - Code2
      - Code3
      properties:
        Code1:
          type: string
        Code2:
          type: string
        Code3:
          type: string
    ItemResponse_DEANumberResponse:
      type: object
      properties:
        Item:
          description: The response object.
          $ref: '#/components/schemas/DEANumberResponse'
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
      description: Represents a generic response containing a single object.
    ClinicianIdentityProofingDisclaimerResponse:
      type: object
      properties:
        IdpDisclaimerDate:
          type: string
          format: date-time
        IdpDisclaimerId:
          type: integer
          format: int32
        IdpDisclaimerText:
          type: string
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
    ClinicianIdentityProofingResponse:
      type: object
      properties:
        SessionID:
          type: string
        Questions:
          type: array
          items:
            type: string
        Answers:
          type: array
          items:
            type: array
            items:
              type: string
        OtpSent:
          type: boolean
        IdpResultSummary:
          type: string
        IDCapture:
          type: boolean
        Result:
          description: The result of the operation.
          $ref: '#/components/schemas/Result'
    ClinicianIdentityProofingRequest:
      type: object
      required:
      - City
      - CreditCardNumber
      - DateOfBirth
      - FirstName
      - HomeAddress
      - IsMobileNumber
      - LastName
      - PhoneNumber
      - State
      - ZipCode
      properties:
        FirstName:
          type: string
          minLength: 0
          maxLength: 32
          pattern: ^[A-Za-z]+(?:[ '\-][A-Za-z]+)*$
        MiddleName:
          type: string
          minLength: 0
          maxLength: 32
          pattern: ^$|^[A-Za-z]+$
        LastName:
          type: string
          minLength: 0
          maxLength: 32
          pattern: ^(?=.{2,32}$)[A-Za-z]+(?:[ '\-][A-Za-z]+)*$
        HomeAddress:
          type: string
          pattern: ^[A-Za-z0-9\/\.\-\#\ ]+$
        City:
          type: string
          minLength: 0
          maxLength: 38
          pattern: ^[A-Za-z]+\.?(?:[ '\-][A-Za-z]+\.?)*$
        State:
          type: string
        ZipCode:
          type: string
          minLength: 0
          maxLength: 10
          pattern: ^(?:\d{5}|\d{9}|\d{5}\-\d{4})$
        DateOfBirth:
          type: string
          format: date-time
        SocialSecurityNumber:
          type: string
          minLength: 0
          maxLength: 11
          pattern: ^(?:\d{9}|\d{3}\-\d{2}\-\d{4}|\d{3} \d{2} \d{4})$
        CreditCardNumber:
          type: string
        DrivingLicenseNumber:
          type: string
        DrivingLicenseNumberState:
          type: string
        PhoneNumber:
          type: string
        IsMobileNumber:
          type: boolean
      description: represent a request to clinican identity proof
    ClinicianSetPinRequest:
      type: object
      required:
      - PIN
      properties:
        PIN:
          type: string
    PrescriberInfo:
      type: object
      properties:
        Address1:
          type: string
        Address2:
          type: string
        City:
          type: string
        State:
          type: string
        ZipCode:
          type: string
        PrimaryPhone:
          type: string
        PrimaryPhoneType:
          type: string
          enum:
