          text/json:
            schema:
              $ref: '#/components/schemas/AddEditClinicianRequest'
          application/problem+json:
            schema:
              $ref: '#/components/schemas/AddEditClinicianRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/AddEditClinicianRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/AddEditClinicianRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddEditClinicianRequest'
        description: Updated clinician data
        required: true
