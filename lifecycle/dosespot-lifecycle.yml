deprecation:
  policy_url: https://dosespot.com/transitioning-to-api-v2-and-the-medi-span-drug-database/
  formal_policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    DoseSpot publishes no standing deprecation policy page and does not emit RFC 8594 Sunset/Deprecation
    headers. It does publish dated migration notices and it marks retired values inline in the enumeration
    tables. The v1 retirement is the worked example below.
  announced_migrations:
    - from: API v1 (Lexicomp drug database)
      to: API v2 (Medi-Span drug database)
      announcement: https://dosespot.com/transitioning-to-api-v2-and-the-medi-span-drug-database/
      start_by: '2024-04-30'
      complete_by: End of Summer 2024
      driver: >-
        "Lexicomp will not be updated beginning the second half of 2024" - the underlying drug compendium was
        discontinued, forcing the v2 migration.
      support: >-
        Each customer is assigned an Integration Specialist; new documentation, Postman collections and Swagger
        specifications are shared, plus a staging environment with a new client for testing.
      caveat: >-
        DoseSpot states it "will not be able to migrate 100% of these records" between drug compendiums; some
        items must be manually recreated.
  deprecated_values_in_docs:
    source: https://docs.dosespot.com/staging/docs/enumeration-tables
    note: >-
      Retired enumeration members are marked "Deprecated. Do not use" in place rather than removed - e.g.
      DenialReasonType 3/10/11/12/13, GenderType 3 (Unknown), FreeTextPrescriptionType 1 (Medication),
      PatientMedicationStatusType 0 and 2, PrescriptionStatusType 5 (FaxSent).
  deprecated_operations: []
  deprecated_operations_note: >-
    No operation in either published Swagger document carries `deprecated: true`.

