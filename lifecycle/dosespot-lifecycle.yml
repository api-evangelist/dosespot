  spec_versions:
    - {name: Full_EPCSV2, title: 'DoseSpot REST API - Plan: Full + EPCS - V2'}
    - {name: JumpStart_EPCSV2, title: 'DoseSpot REST API - Plan: Jumpstart + EPCS - V2'}
  note: >-
    The developer portal states the API guide "is connected directly to DoseSpot's API codebase and is
