note: DoseSpot does not return RFC 9457 problem documents for application errors. Every published operation declares
  only a 200 response; the operation outcome is carried on the Result object as a numeric ResultCode plus a ResultDescription
  string. The SaveResultsStatus table below is the published code registry a client must switch on. Codes 1-1999
  are success/informational, 2000-2999 are validation, duplicate and access errors, and 3000-3999 are authorization,
  token and runtime errors; 0 is SystemError. Transport-level failures (400 validation, 429 rate limit, 404 unknown
  path) are recorded in errors/dosespot-problem-types.yml.
